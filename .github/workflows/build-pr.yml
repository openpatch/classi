name: Build PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Package APK
        run: fastforge package --platform android --targets apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: classi-android-apk-pr${{ github.event.pull_request.number }}
          path: dist/**/*.apk

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libssl-dev locate

      - name: Install appimagetool
        run: |
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Package AppImage
        run: fastforge package --platform linux --targets appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: classi-linux-appimage-pr${{ github.event.pull_request.number }}
          path: dist/**/*.AppImage

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Package DMG
        run: fastforge package --platform macos --targets dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: classi-macos-dmg-pr${{ github.event.pull_request.number }}
          path: dist/**/*.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Package EXE
        run: fastforge package --platform windows --targets exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: classi-windows-exe-pr${{ github.event.pull_request.number }}
          path: dist/**/*.exe
