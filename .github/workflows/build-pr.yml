            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} does not have write access and cannot trigger builds.`);
            }

      - name: React with rocket
        uses: actions/github-script@v7
        with:
