          name: classi-windows-exe-pr${{ github.event.issue.number }}
          path: dist/**/*.exe

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const url = process.env.ARTIFACT_URL;
            const body = url
              ? `### 📦 Windows build ready\n\n[Download EXE installer](${url})`
              : `### 📦 Windows build ready\n\nThe EXE installer is available in the [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
