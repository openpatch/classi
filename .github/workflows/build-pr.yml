name: Build PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  reactions: write

jobs:
  build-android:
    name: Build Android
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/build android')
    runs-on: ubuntu-latest
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} does not have write access and cannot trigger builds.`);
            }

      - name: React with rocket
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Get commit hash
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Package APK
        env:
          APP_ID_SUFFIX: .pr
          APP_LABEL_SUFFIX: " (PR)"
        run: >-
          fastforge package --platform android --targets apk
          --build-dart-define GIT_HASH=${{ env.GIT_HASH }}
          --build-dart-define APP_SUFFIX=" (PR)"

      - name: Upload APK to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pr-${{ github.event.issue.number }}-android"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          APK=$(find dist -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK file found in dist/" >&2
            exit 1
          fi
          FILENAME=$(basename "$APK")
          gh release create "$TAG" "$APK" \
            --prerelease \
            --title "PR #${{ github.event.issue.number }} – Android build" \
            --notes "Android APK build for PR #${{ github.event.issue.number }}"
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}" >> $GITHUB_ENV

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
        with:
          script: |
            const url = process.env.DOWNLOAD_URL;
            const body = url
              ? `### 📦 Android build ready\n\n[Download APK](${url})`
              : `### 📦 Android build ready\n\nThe APK is available in the [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

  build-linux:
    name: Build Linux
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/build linux')
    runs-on: ubuntu-latest
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} does not have write access and cannot trigger builds.`);
            }

      - name: React with rocket
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libssl-dev locate

      - name: Install appimagetool
        run: |
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Get commit hash
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Package AppImage
        run: >-
          fastforge package --platform linux --targets appimage
          --build-dart-define GIT_HASH=${{ env.GIT_HASH }}
          --build-dart-define APP_SUFFIX=" (PR)"

      - name: Upload AppImage to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pr-${{ github.event.issue.number }}-linux"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          APPIMAGE=$(find dist -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage file found in dist/" >&2
            exit 1
          fi
          FILENAME=$(basename "$APPIMAGE")
          gh release create "$TAG" "$APPIMAGE" \
            --prerelease \
            --title "PR #${{ github.event.issue.number }} – Linux build" \
            --notes "Linux AppImage build for PR #${{ github.event.issue.number }}"
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}" >> $GITHUB_ENV

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
        with:
          script: |
            const url = process.env.DOWNLOAD_URL;
            const body = url
              ? `### 📦 Linux build ready\n\n[Download AppImage](${url})`
              : `### 📦 Linux build ready\n\nThe AppImage is available in the [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

  build-macos:
    name: Build macOS
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/build macos')
    runs-on: macos-latest
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} does not have write access and cannot trigger builds.`);
            }

      - name: React with rocket
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Get commit hash
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Package DMG
        run: >-
          fastforge package --platform macos --targets dmg
          --build-dart-define GIT_HASH=${{ env.GIT_HASH }}
          --build-dart-define APP_SUFFIX=" (PR)"

      - name: Upload DMG to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pr-${{ github.event.issue.number }}-macos"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          DMG=$(find dist -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "No DMG file found in dist/" >&2
            exit 1
          fi
          FILENAME=$(basename "$DMG")
          gh release create "$TAG" "$DMG" \
            --prerelease \
            --title "PR #${{ github.event.issue.number }} – macOS build" \
            --notes "macOS DMG build for PR #${{ github.event.issue.number }}"
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}" >> $GITHUB_ENV

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
        with:
          script: |
            const url = process.env.DOWNLOAD_URL;
            const body = url
              ? `### 📦 macOS build ready\n\n[Download DMG](${url})`
              : `### 📦 macOS build ready\n\nThe DMG is available in the [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

  build-windows:
    name: Build Windows
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/build windows')
    runs-on: windows-latest
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} does not have write access and cannot trigger builds.`);
            }

      - name: React with rocket
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Get commit hash
        shell: bash
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Package EXE
        shell: bash
        run: >-
          fastforge package --platform windows --targets exe
          --build-dart-define GIT_HASH=${{ env.GIT_HASH }}
          --build-dart-define APP_SUFFIX=" (PR)"

      - name: Upload EXE to GitHub Release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pr-${{ github.event.issue.number }}-windows"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          EXE=$(find dist -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "No EXE file found in dist/" >&2
            exit 1
          fi
          FILENAME=$(basename "$EXE")
          gh release create "$TAG" "$EXE" \
            --prerelease \
            --title "PR #${{ github.event.issue.number }} – Windows build" \
            --notes "Windows EXE installer build for PR #${{ github.event.issue.number }}"
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}" >> $GITHUB_ENV

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
        with:
          script: |
            const url = process.env.DOWNLOAD_URL;
            const body = url
              ? `### 📦 Windows build ready\n\n[Download EXE installer](${url})`
              : `### 📦 Windows build ready\n\nThe EXE installer is available in the [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
