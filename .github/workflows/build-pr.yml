name: Build PR

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - android
          - linux
          - macos
          - windows
      pr_number:
        description: 'Pull request number to post the artifact link to (leave empty to skip)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  build-android:
    name: Build Android
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Package APK
        run: fastforge package --platform android --targets apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: classi-android-apk-pr${{ inputs.pr_number || 'manual' }}
          path: dist/**/*.apk

      - name: Comment on PR
        if: inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: `### 📦 Android build ready\n\nThe APK artifact has been built. Download it from the [Actions run](${runUrl}) — expand the **Artifacts** section at the bottom of the page.`,
            });

  build-linux:
    name: Build Linux
    if: inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libssl-dev locate

      - name: Install appimagetool
        run: |
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Package AppImage
        run: fastforge package --platform linux --targets appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: classi-linux-appimage-pr${{ inputs.pr_number || 'manual' }}
          path: dist/**/*.AppImage

      - name: Comment on PR
        if: inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: `### 📦 Linux build ready\n\nThe AppImage artifact has been built. Download it from the [Actions run](${runUrl}) — expand the **Artifacts** section at the bottom of the page.`,
            });

  build-macos:
    name: Build macOS
    if: inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Package DMG
        run: fastforge package --platform macos --targets dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: classi-macos-dmg-pr${{ inputs.pr_number || 'manual' }}
          path: dist/**/*.dmg

      - name: Comment on PR
        if: inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: `### 📦 macOS build ready\n\nThe DMG artifact has been built. Download it from the [Actions run](${runUrl}) — expand the **Artifacts** section at the bottom of the page.`,
            });

  build-windows:
    name: Build Windows
    if: inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Package EXE
        run: fastforge package --platform windows --targets exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: classi-windows-exe-pr${{ inputs.pr_number || 'manual' }}
          path: dist/**/*.exe

      - name: Comment on PR
        if: inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: `### 📦 Windows build ready\n\nThe EXE installer artifact has been built. Download it from the [Actions run](${runUrl}) — expand the **Artifacts** section at the bottom of the page.`,
            });
