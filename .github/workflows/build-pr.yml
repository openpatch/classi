name: Build PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  reactions: write

jobs:
  build-android:
    name: Build Android
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/build android')
    runs-on: ubuntu-latest
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} does not have write access and cannot trigger builds.`);
            }

      - name: React with rocket
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Get commit hash
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Package APK
        env:
          APP_ID_SUFFIX: .pr
          APP_LABEL_SUFFIX: " (PR)"
        run: >-
          fastforge package --platform android --targets apk
          --build-dart-define GIT_HASH=${{ env.GIT_HASH }}
          --build-dart-define APP_SUFFIX=" (PR)"

      - name: Upload Android artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: classi-android-apk-pr${{ github.event.issue.number }}
          path: dist/**/*.apk

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const url = process.env.ARTIFACT_URL;
            const body = url
              ? `### 📦 Android build ready\n\n[Download APK](${url})`
              : `### 📦 Android build ready\n\nThe APK is available in the [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

  build-linux:
    name: Build Linux
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/build linux')
    runs-on: ubuntu-latest
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} does not have write access and cannot trigger builds.`);
            }

      - name: React with rocket
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libssl-dev locate

      - name: Install appimagetool
        run: |
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Get commit hash
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Package AppImage
        run: >-
          fastforge package --platform linux --targets appimage
          --build-dart-define GIT_HASH=${{ env.GIT_HASH }}
          --build-dart-define APP_SUFFIX=" (PR)"

      - name: Upload Linux artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: classi-linux-appimage-pr${{ github.event.issue.number }}
          path: dist/**/*.AppImage

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const url = process.env.ARTIFACT_URL;
            const body = url
              ? `### 📦 Linux build ready\n\n[Download AppImage](${url})`
              : `### 📦 Linux build ready\n\nThe AppImage is available in the [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

