name: Deploy Site

# Publishes classi.openpatch.org: the landing page at `/` and the Avatar
# Designer at `/avatar/`.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tool/build_site.sh'
      - 'lib/avatar_designer/**'
      - 'lib/shared/avatar/**'
      - 'lib/features/avatar/avatar_helpers.dart'
      - 'web/**'
      - 'pubspec.yaml'
      - 'assets/translations/**'
      - '.github/logo.png'
      - 'linux/packaging/screenshots/**'
      - 'fastlane/metadata/android/en-US/images/phoneScreenshots/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the Avatar Designer
        run: >-
          flutter build web --release
          --target lib/avatar_designer/main.dart
          --base-href /avatar/
          --pwa-strategy=none

      - name: Assemble the site
        run: tool/build_site.sh build/site build/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
