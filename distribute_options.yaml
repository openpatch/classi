output: dist/
releases:
  - name: release
    jobs:
      - name: release-android
        package:
          platform: android
          target: apk
      - name: release-linux
        package:
          platform: linux
          target: appimage
      - name: release-macos
        package:
          platform: macos
          target: dmg
      - name: release-windows
        package:
          platform: windows
          target: exe
